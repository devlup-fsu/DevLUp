<div class="meeting-card">
  <div class="meeting-header">
    <h3>{{title}}</h3>
    <h4>Presenter{{'s' if len(presenters) > 1 else ''}}: {{', '.join(presenters)}}</h4>
    <p>All skill levels welcome</p>
  </div>
  <div class="meeting-body">
    <div class="meeting-row">
      <div class="meeting-icon">📅</div>
      <div>
        <div class="meeting-label">Date</div>
        <div class="meeting-value">{{date}}</div>
        <div class="meeting-sub">Repeats every week</div>
      </div>
    </div>
    <div class="meeting-row">
      <div class="meeting-icon">🕖</div>
      <div>
        <div class="meeting-label">Time</div>
        <div class="meeting-value">4:30 PM - 6:00 PM</div>
        <div class="meeting-sub">Eastern Time (ET)</div>
      </div>
    </div>
    <div class="meeting-row">
      <div class="meeting-icon">📍</div>
      <div>
        <div class="meeting-label">Location</div>
        <a class="meeting-value" href="{{location_link}}">{{location}}</a>
        <div class="meeting-sub">{{location_sub}}</div>
      </div>
    </div>
  </div>
</div>
